[package]
name = "ossl-sys"
version.workspace = true
edition.workspace = true
description = "Low-level OpenSSL version 3+ bindings"
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"

[lib]
test = true

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dependencies]
cfg-if = "1.0.0"
libc = "0.2.151"
vsprintf = { version = "2.0.0", optional = true }

[dev-dependencies]
hex = "0.4.3"
serial_test = "3.1.1"

[features]
dynamic = [] # Builds against system libcrypto.so
fips = [] # Builds against sources and libfips.a instead of libcrypto
